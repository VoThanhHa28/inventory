version: '3.8'

services:

  # =============================================
  # MySQL Database with persistent volume
  # =============================================
  mysqldb:
    image: mysql:8.0
    container_name: inventory_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: inventory_db
    ports:
      - "3307:3306"         # 3307 local → 3306 container (avoid conflict with local MySQL)
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================
  # Redis — Distributed Shared Cache
  # app1 và app2 đều kết nối vào đây
  # =============================================
  redis:
    image: redis:7-alpine
    container_name: inventory_redis
    restart: always
    ports:
      - "6380:6379"           # 6380 local (avoid conflict if another Redis is on 6379)
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  # =============================================
  # Spring Boot App Instance 1
  # =============================================
  app1:
    build: .
    container_name: inventory_app_1
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/inventory_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "1234"
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_EXPIRATION: 86400000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysqldb:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8080"              # Only exposed to nginx internally, not to host

  # =============================================
  # Spring Boot App Instance 2
  # =============================================
  app2:
    build: .
    container_name: inventory_app_2
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/inventory_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "1234"
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_EXPIRATION: 86400000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysqldb:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8080"

  # =============================================
  # Nginx Load Balancer (round-robin → app1, app2)
  # =============================================
  nginx:
    image: nginx:alpine
    container_name: inventory_nginx
    restart: always
    ports:
      - "80:80"             # All external traffic enters here
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2

volumes:
  db_data:                  # Persistent MySQL data survives container restarts