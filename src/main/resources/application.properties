# --- 1. Cau hinh Server ---
server.port=8080

# --- Redis Cache ---
# Local dev: Redis chay tren localhost:6379
# Docker: override bang REDIS_HOST env var trong docker-compose
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- 2. Cau hinh Database (MySQL Docker) ---
# Local dev: localhost:3307 | Docker: overridden by SPRING_DATASOURCE_URL env var in docker-compose
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/inventory_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- 3. Cau hinh JPA / Hibernate ---
# Tu dong cap nhat bang khi sua code Entity (update/create/none)
spring.jpa.hibernate.ddl-auto=create
# Luon execute data.sql sau khi Hibernate tao schema
spring.sql.init.mode=always
# QUAN TRONG: Cho doi cho Hibernate tao schema xong truoc khi chay data.sql
spring.jpa.defer-datasource-initialization=true
# Hien cau SQL trong console de debug
spring.jpa.show-sql=true
# Format SQL cho de doc
spring.jpa.properties.hibernate.format_sql=true
# Dialect chuan cho MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- 4. Cau hinh Inventory (Dashboard) ---
# Nguong toi thieu cho canh bao "low stock"
inventory.low-stock-threshold=10

# --- 5. Cau hinh Upload File ---
# Kich thuoc toi da 1 file
spring.servlet.multipart.max-file-size=10MB
# Tong kich thuoc request
spring.servlet.multipart.max-request-size=10MB
# Thu muc luu anh
file.upload-dir=uploads

# --- 5. Cau hinh Logging (Co ban) ---
# Chi hien log INFO tro len (bo qua Debug rac cua Spring)
logging.level.root=INFO
# Rieng goi du an cua minh thi hien DEBUG de soi loi
logging.level.com.project.inventory=DEBUG

# Ep Spring Boot in ra moi loi cua tang Web va Swagger
logging.level.org.springframework.web=DEBUG
logging.level.org.springdoc=DEBUG
logging.level.io.swagger.v3=DEBUG

# Tat tam tinh nang nuot loi cua Spring
server.error.include-message=always
server.error.include-stacktrace=always

# --- Cau hinh JWT (JSON Web Token) ---
# Secret key overridable via JWT_SECRET env var in Docker
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Token expiration in ms: 86400000 = 24h, overridable via JWT_EXPIRATION
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}