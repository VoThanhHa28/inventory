# Test Profile Configuration - Disables Redis for Test Environment
# This profile is activated via @ActiveProfiles("test") in test classes
# Tests use H2 in-memory database and disable Redis auto-configuration

# H2 In-Memory Database (overrides Redis)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate Configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== DISABLE REDIS FOR TESTS =====
# Prevent Spring from trying to auto-configure Redis
# Redis will only be used in production via application.properties
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
spring.redis.enabled=false

# Disable Flyway and Liquibase  
spring.flyway.enabled=false
spring.liquibase.enabled=false

# Disable caching in tests (use NoOpCacheManager)
spring.cache.type=none
