# Test Profile Configuration - Disables Redis for Test Environment
# This profile is activated via @ActiveProfiles("test") in test classes
# Tests use H2 in-memory database and disable Redis auto-configuration

# H2 In-Memory Database (overrides Redis)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate Configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== DISABLE REDIS FOR TESTS =====
# Prevent Spring from trying to auto-configure Redis
# Redis will only be used in production via application.properties
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
spring.redis.enabled=false

# Disable automatic SQL script execution (data.sql uses MySQL NOW() syntax, incompatible with H2)
# Tests create their own data via @BeforeEach setup methods instead
spring.sql.init.mode=never

# Caching enabled but uses in-memory ConcurrentMapCacheManager via TestCacheConfig
# See: TestCacheConfig.java for test cache bean configuration
spring.cache.type=simple
