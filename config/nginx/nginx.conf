
# =============================================
# Nginx Configuration — Load Balancer
# Round-robin across 2 Spring Boot instances
# =============================================

events {
    worker_connections 1024;
}

http {

    # Upstream: 2 Spring Boot app instances (Docker service names)
    upstream inventory_app {
        # Default: round-robin (each request goes to next server alternately)
        server app1:8080;
        server app2:8080;
    }

    server {
        listen 80;

        # Forward all HTTP requests to the Spring Boot cluster
        location / {
            proxy_pass http://inventory_app;

            # Pass real client IP to the app (for logging/audit)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout settings
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }
}
